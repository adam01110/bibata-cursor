when:
  - event: ["push"]
    tag: ["*"]
  - event: ["manual"]
engine: "nixery"
dependencies:
  nixpkgs/nixpkgs-unstable:
    - bun
    - coreutils
    - curl
    - git
    - jq
    - ouch
    - xxd
environment:
  ATP_IDENTIFIER: "adam0.dev"
steps:
  - name: "Install dependencies"
    command: bun install --frozen-lockfile
  - name: "Render bitmaps"
    command: bun run generate
  - name: "Package bitmaps"
    command: |
      set -euo pipefail
      shopt -s nullglob
      mkdir -p dist
      for dir in bitmaps/*; do
        name="$(basename "$dir")"
        (cd bitmaps && ouch compress "$name" "../dist/${name}.zip")
      done
  - name: "Publish release artifacts"
    command: scripts/publish-tangled-artifacts.sh
