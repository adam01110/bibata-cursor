name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Render bitmaps
        run: bun run generate
      - name: Package bitmaps (zip each subfolder)
        run: |
          set -euxo pipefail
          shopt -s nullglob
          mkdir dist
          for dir in bitmaps/*; do
            name="$(basename "$dir")"
            (cd bitmaps && zip -r "../dist/${name}.zip" "$name")
          done
      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
